networks:
  aw-network:
    driver: bridge

services:
  postgres:
    image: postgres:17-alpine
    container_name: navalis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CHAVE_POSTGRES_DB}
      POSTGRES_USER: ${CHAVE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CHAVE_POSTGRES_PASSWORD}
    ports:
      - "${CHAVE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHAVE_POSTGRES_USER} -d ${CHAVE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aw-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: navalis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${CHAVE_POSTGRES_DB}
      CHAVE_POSTGRES_USER: ${CHAVE_POSTGRES_USER}
      CHAVE_POSTGRES_PASSWORD: ${CHAVE_POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "5000:5000"
    networks:
      - aw-network

  # === OBSERVABILIDADE ===

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: navalis-prometheus
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - aw-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: navalis-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - aw-network

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: navalis-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - aw-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
