spring:
  application:
    name: Navalis
  mvc:
    problemdetails:
      enabled: false
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${CHAVE_POSTGRES_PORT}/${CHAVE_POSTGRES_DB}
    username: ${CHAVE_POSTGRES_USER}
    password: ${CHAVE_POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: 100
  flyway:
    enabled: true
  web:
    error:
      include-stacktrace: never

server:
  port: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:navalis-default-secret-key-that-should-be-changed-in-production}

# Observabilidade
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: navalis-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v2/spans

# Log com trace/span IDs
logging:
  pattern:
    correlation: "[${spring.application.name:},%mdc{traceId:-},%mdc{spanId:-}] "
